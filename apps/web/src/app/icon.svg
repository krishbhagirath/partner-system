<!--
  Two equal marks sharing one slot: the product in one shape.

  Replaces the "P" tile with a gold arrow badge, which collapsed into an unreadable
  smudge at favicon size and whose arrow carried no meaning. Two forms of equal
  weight survive 16px, and the gold one keeps the mark findable in a tab strip.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#7A003C"/>
  <rect x="11" y="23" width="18" height="18" rx="5" fill="#FFFFFF"/>
  <rect x="35" y="23" width="18" height="18" rx="5" fill="#C9A227"/>
</svg>
